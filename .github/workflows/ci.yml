name: PureDS4 VIIPER checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Build Windows backend and verify notices
        shell: pwsh
        run: .\scripts\build-pureds4-backend.ps1 -OutputDir .\dist -RequireClean
